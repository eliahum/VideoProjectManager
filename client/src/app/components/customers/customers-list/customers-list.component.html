<div class="customers-container">
  <div class="header">
    <h1>לקוחות</h1>
    <button mat-raised-button color="primary" (click)="openCustomerForm()">
      <mat-icon>add</mat-icon>
      הוסף לקוח
    </button>
  </div>

  <!-- Search box -->
  <div class="search-container" style="margin-bottom: 16px;">
    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>חפש לקוח</mat-label>
      <input matInput [(ngModel)]="searchText" (ngModelChange)="applyFilter()" placeholder="חפש בכל השדות...">
      <button *ngIf="searchText" matSuffix mat-icon-button aria-label="נקה חיפוש" (click)="clearSearch()">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
  </div>

  <mat-card *ngIf="customers.length === 0" class="empty-state">
    <mat-card-content>
      <mat-icon class="large-icon">people</mat-icon>
      <h2>אין לקוחות</h2>
      <p>התחל על ידי הוספת לקוח חדש</p>
    </mat-card-content>
  </mat-card>
  

  <div class="table-container" *ngIf="customers.length > 0">
    <table mat-table [dataSource]="customers" class="customers-table">
      <!-- Lead ID Column -->
      <ng-container matColumnDef="leadId">
        <th mat-header-cell *matHeaderCellDef>מספר Lead</th>
        <td mat-cell *matCellDef="let customer">
          <span *ngIf="customer.leadId; else noLead">{{ customer.leadId }}</span>
          <ng-template #noLead>-</ng-template>
        </td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>שם</th>
        <td mat-cell *matCellDef="let customer">
          <div class="name-cell">
            <mat-icon>person</mat-icon>
            <span>{{ customer.name }}</span>
          </div>
        </td>
      </ng-container>

      <!-- Phone Column -->
      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef>טלפון</th>
        <td mat-cell *matCellDef="let customer">
          <div class="phone-cell">
            <mat-icon>phone</mat-icon>
            <span>{{ customer.phone }}</span>
          </div>
        </td>
      </ng-container>

      <!-- Email Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>אימייל</th>
        <td mat-cell *matCellDef="let customer">
          <div class="email-cell">
            <mat-icon>email</mat-icon>
            <span>{{ customer.email }}</span>
          </div>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>פעולות</th>
        <td mat-cell *matCellDef="let customer">
          <button mat-icon-button color="primary" (click)="openCustomerForm(customer)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteCustomer(customer.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
