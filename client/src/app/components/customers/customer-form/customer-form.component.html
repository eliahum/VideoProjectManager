<h2 mat-dialog-title>{{ isEditMode ? 'עריכת לקוח' : 'הוספת לקוח חדש' }}</h2>

<mat-dialog-content>
  <form [formGroup]="customerForm" class="customer-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>שם החברה</mat-label>
      <input matInput formControlName="companyName" required>
      <mat-icon matPrefix>business</mat-icon>
      <mat-error *ngIf="customerForm.get('companyName')?.hasError('required')">
        שדה חובה
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>איך הגיע אלי</mat-label>
      <input matInput formControlName="howFoundUs">
      <mat-icon matPrefix>place</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>טקסט חופשי</mat-label>
      <textarea matInput formControlName="notes" rows="3"></textarea>
      <mat-icon matPrefix>note</mat-icon>
    </mat-form-field>

    <!-- Contacts Section -->
    <div class="contacts-section">
      <div class="contacts-header">
        <h3>אנשי קשר</h3>
        <button mat-raised-button color="primary" type="button" (click)="addContact()">
          <mat-icon>person_add</mat-icon>
          הוסף איש קשר
        </button>
      </div>

      <div formArrayName="contacts" class="contacts-list">
        <mat-card *ngFor="let contact of contacts.controls; let i = index" class="contact-card" [formGroupName]="i">
          <div class="contact-form-row">
            <mat-form-field appearance="outline" class="contact-name-field">
              <mat-label>שם איש קשר</mat-label>
              <input matInput formControlName="name" required>
              <mat-error *ngIf="contact.get('name')?.hasError('required')">
                שדה חובה
              </mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="contact-phone-field">
              <mat-label>טלפון</mat-label>
              <input matInput formControlName="phone" type="tel" required>
              <mat-error *ngIf="contact.get('phone')?.hasError('required')">
                שדה חובה
              </mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="contact-email-field">
              <mat-label>מייל</mat-label>
              <input matInput formControlName="email" type="email">
            </mat-form-field>

            <mat-checkbox formControlName="isPrimary" class="primary-checkbox">
              ראשי
            </mat-checkbox>

            <button mat-icon-button color="warn" type="button" (click)="removeContact(i)" [disabled]="contacts.controls.length <= 1" class="remove-contact-btn">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </mat-card>
      </div>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">ביטול</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="!customerForm.valid">
    <mat-icon>save</mat-icon>
    שמור
  </button>
</mat-dialog-actions>
