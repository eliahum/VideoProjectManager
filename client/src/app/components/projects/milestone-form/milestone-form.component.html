<h2 mat-dialog-title>{{ isEditMode ? 'עריכת אבן דרך: ' + data.milestone?.name : 'הוספת אבן דרך חדשה' }}</h2>

<mat-dialog-content>
  <form [formGroup]="milestoneForm" class="milestone-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>שם אבן הדרך</mat-label>
      <input matInput formControlName="name" required>
      <mat-icon matPrefix>flag</mat-icon>
      <mat-error *ngIf="milestoneForm.get('name')?.hasError('required')">
        שדה חובה
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>הפנייה למסמך</mat-label>
      <input matInput formControlName="documentReference">
      <mat-icon matPrefix>description</mat-icon>
    </mat-form-field>

    <div class="form-row">
      <mat-form-field appearance="outline" class="half-width compact-field">
        <mat-label>תאריך</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="date">
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline" class="half-width compact-field">
        <mat-label>סטטוס</mat-label>
        <mat-select formControlName="status" required>
          <mat-option *ngFor="let status of milestoneStatuses" [value]="status">
            {{ status }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <div class="urgent-checkbox inline">
        <mat-checkbox formControlName="isUrgent">
          <span class="urgent-label">דחוף</span>
        </mat-checkbox>
      </div>
    </div>

    <div class="suppliers-section">
      <div class="section-header">
        <h3>ספקים</h3>
        <button mat-raised-button type="button" (click)="addSupplier()">
          <mat-icon>add</mat-icon>
          הוסף ספק
        </button>
      </div>

      <div formArrayName="suppliers" class="suppliers-list">
        <mat-card *ngFor="let supplier of suppliers.controls; let i = index" [formGroupName]="i" class="supplier-card">
          <div class="supplier-form-row">
            <mat-form-field appearance="outline" class="supplier-select">
              <mat-label>בחר ספק</mat-label>
              <input matInput
                     [formControl]="supplierInputCtrls[i]"
                     [matAutocomplete]="supplierAuto"
                     (focus)="onSupplierFocus(i)"
                     (input)="onSupplierInput(i)"
                     autocomplete="off"
                     placeholder="בחר ספק..."
                     required>
              <mat-autocomplete #supplierAuto="matAutocomplete"
                                [displayWith]="displaySupplier"
                                [autoActiveFirstOption]="false"
                                (optionSelected)="onSupplierSelected($event.option.value, i)">
                <mat-option *ngFor="let availableSupplier of filteredSuppliers[i] | async" [value]="availableSupplier">
                  {{ availableSupplier.name }}
                </mat-option>
              </mat-autocomplete>
            </mat-form-field>

            <mat-form-field appearance="outline" class="amount-field">
              <mat-label>סכום</mat-label>
              <input matInput type="number" formControlName="amount" required>
              <span matPrefix>₪</span>
              <mat-error *ngIf="supplier.get('amount')?.hasError('required')">
                שדה חובה
              </mat-error>
              <mat-error *ngIf="supplier.get('amount')?.hasError('min')">
                סכום חייב להיות חיובי
              </mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="date-field">
              <mat-label>תאריך</mat-label>
              <input matInput [matDatepicker]="supplierPicker" formControlName="date">
              <mat-datepicker-toggle matIconSuffix [for]="supplierPicker"></mat-datepicker-toggle>
              <mat-datepicker #supplierPicker></mat-datepicker>
            </mat-form-field>

            <button mat-raised-button 
                    type="button" 
                    class="paid-button"
                    [class.paid]="supplier.get('isPaid')?.value"
                    (click)="togglePaid(i)">
              <mat-icon>{{ supplier.get('isPaid')?.value ? 'check_circle' : 'radio_button_unchecked' }}</mat-icon>
              {{ supplier.get('isPaid')?.value ? 'שולם' : 'לא שולם' }}
            </button>

            <button mat-icon-button color="warn" type="button" (click)="removeSupplier(i)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </mat-card>

        <p *ngIf="suppliers.length === 0" class="no-suppliers">לא נוספו ספקים</p>
      </div>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">ביטול</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="!isFormValid">
    <mat-icon>save</mat-icon>
    שמור
  </button>
</mat-dialog-actions>
