<div class="suppliers-dialog">
  <div class="dialog-header">
    <h2 mat-dialog-title>
      <mat-icon>{{ data.isPaidList ? 'check_circle' : 'pending' }}</mat-icon>
      <span>ספקים {{ data.isPaidList ? 'ששולם להם' : 'שטרם שולם להם' }}</span>
    </h2>
    <button mat-icon-button (click)="close()" class="close-btn">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div mat-dialog-content class="dialog-content">
    <div class="suppliers-list">
      <div class="supplier-item" *ngFor="let supplier of data.suppliers">
        <div class="supplier-row">
          <div class="supplier-name">
            <mat-icon>business</mat-icon>
            <span>{{ supplier.supplierName }}</span>
          </div>
          <div class="supplier-milestone">
            <mat-icon>flag</mat-icon>
            <span>{{ supplier.milestoneName }}</span>
          </div>
          <div class="supplier-stage">
            <mat-icon>layers</mat-icon>
            <span>{{ supplier.stageName }}</span>
          </div>
          <div class="supplier-date" *ngIf="supplier.date">
            <mat-icon>calendar_today</mat-icon>
            <span>{{ supplier.date | date:'dd/MM/yyyy' }}</span>
          </div>
          <div class="supplier-amount" [class.unpaid]="!data.isPaidList">₪{{ supplier.amount }}</div>
        </div>
      </div>
    </div>
  </div>

  <div mat-dialog-actions class="dialog-actions">
    <button mat-raised-button color="primary" (click)="close()">סגור</button>
  </div>
</div>
