<h2 mat-dialog-title>{{ isEditMode ? 'עריכת פרוייקט' : 'הוספת פרוייקט חדש' }}</h2>

<mat-dialog-content>
  <form [formGroup]="projectForm" class="project-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>לקוח</mat-label>
      <mat-select formControlName="customerId" required>
        <mat-option *ngFor="let customer of customers" [value]="customer.id">
          {{ customer.name }}
        </mat-option>
      </mat-select>
      <mat-icon matPrefix>person</mat-icon>
      <mat-error *ngIf="projectForm.get('customerId')?.hasError('required')">
        שדה חובה
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>שם פרוייקט</mat-label>
      <mat-icon matPrefix>video_library</mat-icon>
      <input matInput formControlName="projectName" required>
      <mat-error *ngIf="projectForm.get('projectName')?.hasError('required')">
        שדה חובה
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>סכום ששולם</mat-label>
      <mat-icon matPrefix>payments</mat-icon>
      <input matInput type="number" formControlName="paidAmount">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>תאריך תשלום</mat-label>
      <input matInput [matDatepicker]="paymentPicker" formControlName="paymentDate">

      <mat-datepicker-toggle class="date-toggle" matIconSuffix [for]="paymentPicker">
      </mat-datepicker-toggle>

      <mat-datepicker #paymentPicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>הערת תשלום</mat-label>
      <mat-icon matPrefix>note</mat-icon>
      <input matInput formControlName="paymentNote">
    </mat-form-field>

    <div class="initialize-checkbox" *ngIf="!isEditMode">
      <mat-checkbox formControlName="initializeAllStages">
        <span class="checkbox-label">אתחל את כל השלבים ואבני הדרך</span>
      </mat-checkbox>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">ביטול</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="!projectForm.valid">
    <mat-icon>save</mat-icon>
    שמור
  </button>
</mat-dialog-actions>
