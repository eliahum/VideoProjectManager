<div class="projects-container">
  <div class="header">
    <h1>פרוייקטים</h1>
    <button mat-raised-button color="primary" (click)="openProjectForm()">
      <mat-icon>add</mat-icon>
      הוסף פרוייקט
    </button>
  </div>

  <mat-card *ngIf="projects.length === 0" class="empty-state">
    <mat-card-content>
      <mat-icon class="large-icon">video_library</mat-icon>
      <h2>אין פרוייקטים</h2>
      <p>התחל על ידי הוספת פרוייקט חדש</p>
    </mat-card-content>
  </mat-card>

  <div class="table-container" *ngIf="projects.length > 0">
    <table mat-table [dataSource]="projects" class="projects-table">
      
      <ng-container matColumnDef="customerName">
        <th mat-header-cell *matHeaderCellDef>שם לקוח</th>
        <td mat-cell *matCellDef="let project">{{ project.customerName }}</td>
      </ng-container>

      <ng-container matColumnDef="projectType">
        <th mat-header-cell *matHeaderCellDef>סוג פרוייקט</th>
        <td mat-cell *matCellDef="let project">{{ project.projectType }}</td>
      </ng-container>

      <ng-container matColumnDef="currentStage">
        <th mat-header-cell *matHeaderCellDef>שלב נוכחי</th>
        <td mat-cell *matCellDef="let project">
          <mat-chip class="stage-chip">{{ project.currentStage }}</mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="currentMilestone">
        <th mat-header-cell *matHeaderCellDef>אבן דרך נוכחית</th>
        <td mat-cell *matCellDef="let project">
          <mat-chip color="accent">{{ getCurrentMilestoneName(project) }}</mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>פעולות</th>
        <td mat-cell *matCellDef="let project">
          <button mat-raised-button color="primary" [routerLink]="['/projects', project.id]">
            <mat-icon>visibility</mat-icon>
            צפה בפרוייקט
          </button>
          <button mat-icon-button color="warn" (click)="deleteProject(project.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
