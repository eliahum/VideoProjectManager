<h2 mat-dialog-title>{{ isEditMode ? 'עריכת ליד' : 'הוספת ליד חדש' }}</h2>

<mat-dialog-content>
  <form [formGroup]="leadForm" class="lead-form">
    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>שם חברה</mat-label>
        <input matInput formControlName="companyName" required>
        <mat-icon matPrefix>business</mat-icon>
        <mat-error *ngIf="leadForm.get('companyName')?.hasError('required')">
          שדה חובה
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>איש קשר</mat-label>
        <input matInput formControlName="name" required>
        <mat-icon matPrefix>person</mat-icon>
        <mat-error *ngIf="leadForm.get('name')?.hasError('required')">
          שדה חובה
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline" class="half-width">
        <mat-label>טלפון</mat-label>
        <input matInput formControlName="phone" type="tel" required>
        <mat-icon matPrefix>phone</mat-icon>
        <mat-error *ngIf="leadForm.get('phone')?.hasError('required')">
          שדה חובה
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="half-width">
        <mat-label>מייל</mat-label>
        <input matInput formControlName="email" type="email">
        <mat-icon matPrefix>email</mat-icon>
      </mat-form-field>
    </div>
    <div class="form-row">
      <mat-form-field appearance="outline" class="half-width">
        <mat-label>איך הגיע אלי</mat-label>
        <input matInput formControlName="source" >
        <mat-icon matPrefix>source</mat-icon>

      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>טקסט חופשי</mat-label>
        <textarea matInput formControlName="freeText" rows="3"></textarea>
      </mat-form-field>
    </div>

    <div class="document-reference-field">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>הצעת מחיר (קישור ל-Google Drive)</mat-label>
        <textarea matInput formControlName="priceQuote" placeholder="הדבק קישור לGoogle Drive..." rows="3"></textarea>
        <mat-icon matPrefix class="drive-icon">folder</mat-icon>
      </mat-form-field>
      <button mat-icon-button 
              type="button"
              class="open-link-btn"
              *ngIf="leadForm.get('priceQuote')?.value"
              (click)="openPriceQuoteLink()"
              matTooltip="פתח מסמך בטאב חדש">
        <mat-icon>open_in_new</mat-icon>
      </button>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline" class="half-width">
        <mat-label>תאריך פניה</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="contactDate" required>
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline" class="half-width">
        <mat-label>סטטוס</mat-label>
        <mat-select formControlName="statusNumber" required>
          <mat-option *ngFor="let status of leadStatuses" [value]="status.statusNumber">
            {{ status.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="form-row" *ngIf="showNotInterestedReason">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>למה לא מעוניין?</mat-label>
        <textarea matInput formControlName="notInterestedReason" rows="2" required></textarea>
        <mat-error *ngIf="leadForm.get('notInterestedReason')?.hasError('required')">
          שדה חובה
        </mat-error>
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">ביטול</button>
  <button mat-raised-button color="accent" *ngIf="isEditMode" (click)="convertToCustomer()" [disabled]="hasCustomer">
    <mat-icon>person_add</mat-icon>
    המר ללקוח
  </button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="!leadForm.valid">
    <mat-icon>save</mat-icon>
    שמור
  </button>
</mat-dialog-actions>
