<div class="suppliers-container">
  <div class="header">
    <h1>ספקים</h1>
    <button mat-raised-button color="primary" (click)="openSupplierForm()">
      <mat-icon>add</mat-icon>
      הוסף ספק
    </button>
  </div>

  <!-- Loading Spinner -->
  <div *ngIf="isLoading" class="loading-container">
    <mat-spinner diameter="50"></mat-spinner>
  </div>

  <div *ngIf="!isLoading">
    <!-- Search box -->
    <div class="search-container" style="margin-bottom: 16px;">
      <mat-form-field appearance="outline" style="width: 100%;">
        <mat-label>חפש ספק</mat-label>
        <input matInput [(ngModel)]="searchText" (ngModelChange)="applyFilter()" placeholder="חפש בכל השדות...">
        <button *ngIf="searchText" matSuffix mat-icon-button aria-label="נקה חיפוש" (click)="clearSearch()">
          <mat-icon>close</mat-icon>
        </button>
      </mat-form-field>
    </div>

    <mat-card *ngIf="filteredSuppliers.length === 0" class="empty-state">
      <mat-card-content>
        <mat-icon class="large-icon">business</mat-icon>
        <h2>אין ספקים</h2>
        <p>התחל על ידי הוספת ספק חדש</p>
      </mat-card-content>
    </mat-card>

    <div class="table-container" *ngIf="filteredSuppliers.length > 0">
      <table mat-table [dataSource]="paginatedSuppliers" class="suppliers-table">
      
      <ng-container matColumnDef="supplierNumber">
        <th mat-header-cell *matHeaderCellDef>מספר</th>
        <td mat-cell *matCellDef="let supplier">{{ supplier.supplierNumber }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>שם</th>
        <td mat-cell *matCellDef="let supplier">{{ supplier.name }}</td>
      </ng-container>

      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef>טלפון</th>
        <td mat-cell *matCellDef="let supplier">{{ supplier.phone }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>מייל</th>
        <td mat-cell *matCellDef="let supplier">{{ supplier.email }}</td>
      </ng-container>

      <ng-container matColumnDef="isPaid">
        <th mat-header-cell *matHeaderCellDef>שולם</th>
        <td mat-cell *matCellDef="let supplier">
          <mat-chip [ngClass]="supplier.isPaid ? 'status-paid' : 'status-unpaid'">
            {{ supplier.isPaid ? 'שולם' : 'לא שולם' }}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>פעולות</th>
        <td mat-cell *matCellDef="let supplier">
          <button mat-icon-button color="primary" (click)="openSupplierForm(supplier)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteSupplier(supplier.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    
    <mat-paginator 
      [length]="totalItems"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      [pageIndex]="pageIndex"
      (page)="onPageChange($event)"
      showFirstLastButtons>
    </mat-paginator>
  </div>
  </div>
</div>
