<mat-toolbar color="primary" class="top-toolbar">
  <div class="toolbar-right">
    <div class="toolbar-logo" aria-label="Video Project Manager logo">
      <img src="assets/logo.svg" alt="Video Project Manager logo" />
    </div>
    <span class="toolbar-title">{{ title }}</span>
    <span class="dev-indicator" *ngIf="!isProduction">טסט</span>
  </div>
  <span class="toolbar-spacer"></span>
  
  @if (authService.currentUser$ | async; as user) {
    <div class="user-section">
      <span class="username">שלום {{ user.username }}</span>
      <button mat-icon-button (click)="logout()" matTooltip="יציאה">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  }
  
  <button mat-icon-button (click)="toggleMenu()" class="menu-button">
    <mat-icon>menu</mat-icon>
  </button>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav [mode]="isMobile ? 'over' : 'side'" [opened]="!isMobile" position="start" class="sidenav">
    <mat-nav-list>
      <ng-container *ngFor="let item of filteredMenuItems">
        <!-- Menu item with children -->
        <mat-expansion-panel *ngIf="item.children && item.children.length > 0" class="menu-expansion" [togglePosition]="'after'">
          <mat-expansion-panel-header>
            <mat-panel-title class="nav-item-title">
              <a [routerLink]="item.path" 
                 routerLinkActive="active-link"
                 class="parent-nav-link"
                 (click)="$event.stopPropagation(); closeMenuIfMobile()">
                <mat-icon>{{ item.icon }}</mat-icon>
                <span>{{ item.label }}</span>
              </a>
            </mat-panel-title>
          </mat-expansion-panel-header>
          <a mat-list-item
             *ngFor="let child of item.children"
             [routerLink]="child.path"
             routerLinkActive="active-link"
             class="nav-item submenu-item"
             (click)="closeMenuIfMobile()">
            <mat-icon matListItemIcon>{{ child.icon }}</mat-icon>
            <span matListItemTitle>{{ child.label }}</span>
          </a>
        </mat-expansion-panel>

        <!-- Regular menu item without children -->
        <a mat-list-item
           *ngIf="!item.children || item.children.length === 0"
           [routerLink]="item.path"
           routerLinkActive="active-link"
           class="nav-item"
           (click)="closeMenuIfMobile()">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      </ng-container>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="main-content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
