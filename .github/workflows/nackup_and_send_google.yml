name: MongoDB Backup And Upload Google Drive

on:
  schedule:
    # Runs every day at 2:00 AM UTC (4:00 AM Israel time, usually)
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: servernode/package-lock.json

      - name: Install dependencies
        working-directory: servernode
        run: npm ci

      - name: Run MongoDB backup (ts-node)
        working-directory: servernode
        env:
          DATABASE_URL: ${{ secrets.MONGODB_URL }}

          # Enable OAuth upload inside the script
          ENABLE_GOOGLE_DRIVE_OAUTH_BACKUP: "true"
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_OAUTH_FOLDER_ID: ${{ secrets.GOOGLE_OAUTH_FOLDER_ID }}
        run: npx ts-node scripts/backup-db.ts

      - name: Get newest backup filename
        id: backup_file
        working-directory: servernode/backups
        run: |
          BACKUP_FILE="$(ls -t backup-*.json | head -n 1)"
          echo "filename=$BACKUP_FILE" >> "$GITHUB_OUTPUT"
          echo "Backup file: $BACKUP_FILE"

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mongodb-backup-${{ github.run_number }}
          path: servernode/backups/${{ steps.backup_file.outputs.filename }}
          retention-days: 90

      - name: Create backup summary
        working-directory: servernode/backups
        run: |
          BACKUP_FILE="${{ steps.backup_file.outputs.filename }}"
          FILE_SIZE="$(du -h "$BACKUP_FILE" | cut -f1)"
          echo "### ✅ Backup Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **File:** $BACKUP_FILE" >> $GITHUB_STEP_SUMMARY
          echo "- **Size:** $FILE_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **Time (UTC):** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Saved to:** GitHub Artifacts + (optional) Google Drive OAuth" >> $GITHUB_STEP_SUMMARY
          echo "- **Retention:** 90 days" >> $GITHUB_STEP_SUMMARY
